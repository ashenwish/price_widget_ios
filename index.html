<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<title>Калькулятор</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand"><span class="dot"></span>Калькулятор</div>
    <div class="bar-btns">
      <button class="ib" id="btnPin" hidden></button>
      <button class="ib" id="btnPrice" title="Редактор прайса">⚙</button>
      <button class="ib" id="btnMin" hidden></button>
      <button class="ib" id="btnClose" hidden></button>
    </div>
  </header>

  <section class="lib">
    <div class="chips" id="chips"></div>
    <div class="libList" id="libList"></div>
  </section>

  <section class="est">
    <div class="sec-head">
      <span>Смета</span>
      <button class="link" id="btnClear">очистить</button>
    </div>
    <div class="drop" id="drop">
      <div class="hint" id="hint">Нажми «+» у блока, чтобы добавить</div>
      <div id="lines"></div>
    </div>
  </section>

  <section class="set">
    <button class="sec-head tog" id="togSet"><span>Наценки и налог</span><span id="togArrow">▾</span></button>
    <div class="setBody" id="setBody">
      <label class="sl"><span>Срочность</span><b id="vUrg">0%</b><input type="range" id="sUrg" min="0" max="100" step="5" value="0"></label>
      <label class="sl"><span>Права / лицензия</span><b id="vRig">0%</b><input type="range" id="sRig" min="0" max="200" step="10" value="0"></label>
      <label class="sl"><span>Износ оборудования</span><b id="vWear">0%</b><input type="range" id="sWear" min="0" max="20" step="1" value="5"></label>
      <label class="sl"><span>Скидка</span><b id="vDis">0%</b><input type="range" id="sDis" min="0" max="50" step="1" value="0"></label>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="cPrem"><i></i>Премиум +25%</label>
        <label class="chk"><input type="checkbox" id="cTax"><i></i>Налог</label>
        <select id="selTax"><option value="4">4% (физлица)</option><option value="6">6% (юрлица)</option></select>
      </div>
    </div>
  </section>

  <footer class="tot">
    <div class="cur">
      <div class="seg" id="curSeg">
        <button data-c="RUB" class="on">₽</button>
        <button data-c="USD">$</button>
        <button data-c="EUR">€</button>
      </div>
      <label class="rate" id="rateBox">курс <input type="number" inputmode="decimal" id="rate" min="1" step="0.5"> ₽</label>
    </div>
    <div class="sum">
      <div class="rows" id="rows"></div>
      <div class="big"><span>Итого</span><b id="total">0 ₽</b></div>
    </div>
    <div class="acts">
      <button class="btn" id="btnCopy">Копировать</button>
      <button class="btn pri" id="btnSave">Поделиться</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="modal" id="modal" hidden>
    <div class="card">
      <div class="sec-head"><span>Прайс (₽)</span><button class="link" id="btnReset">сбросить</button></div>
      <div class="plist" id="plist"></div>
      <div class="pact">
        <button class="btn" id="btnAdd">+ Блок</button>
        <button class="btn pri" id="btnDone">Готово</button>
      </div>
    </div>
  </div>

</div>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
